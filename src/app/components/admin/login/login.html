<div class="login-container">
  <!-- Main Login Card -->
  <div class="login-card">
    <!-- Header Section -->
    <div class="login-header">
      <div class="logo-container">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            <path d="M12 2v20"/>
          </svg>
        </div>
      </div>
      
      <div class="header-text">
        <h1>Chào mừng trở lại</h1>
        <p>Đăng nhập vào hệ thống quản trị</p>
      </div>
    </div>

    <!-- Login Form -->
    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <div class="input-container">
          <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
          <input
            type="text"
            id="username"
            [(ngModel)]="username"
            name="username"
            placeholder="Tên đăng nhập"
            (keypress)="onKeyPress($event)"
            (input)="clearError()"
            (focus)="onInputFocus('username')"
            (blur)="onInputBlur('username')"
            [disabled]="isLoading"
            required
            class="form-input"
          >
          <div class="input-border"></div>
        </div>
      </div>

      <div class="form-group">
        <div class="input-container">
          <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </div>
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            [(ngModel)]="password"
            name="password"
            placeholder="Mật khẩu"
            (keypress)="onKeyPress($event)"
            (input)="clearError()"
            (focus)="onInputFocus('password')"
            (blur)="onInputBlur('password')"
            [disabled]="isLoading"
            required
            class="form-input"
          >
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            [disabled]="isLoading"
            [attr.aria-label]="showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
          >
            @if (showPassword) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            }
          </button>
          <div class="input-border"></div>
        </div>
      </div>

      @if (errorMessage) {
        <div class="error-message" [@slideIn]>
          <div class="error-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <line x1="15" y1="9" x2="9" y2="15"/>
              <line x1="9" y1="9" x2="15" y2="15"/>
            </svg>
          </div>
          <span>{{ errorMessage }}</span>
        </div>
      }

      <button
        type="submit"
        class="login-btn"
        [disabled]="isLoading || !username.trim() || !password.trim()"
        [class.loading]="isLoading"
      >
        <div class="btn-content">
          @if (isLoading) {
            <div class="spinner-container">
              <div class="spinner"></div>
            </div>
            <span>Đang xác thực...</span>
          } @else {
            <div class="btn-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M21 12H9"/>
              </svg>
            </div>
            <span>Đăng nhập</span>
          }
        </div>
        <div class="btn-shine"></div>
      </button>
    </form>

    <!-- Footer Section -->
    <div class="login-footer">
      <div class="credentials-card">
        <div class="credentials-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="M9 12l2 2 4-4"/>
          </svg>
          <span>Thông tin đăng nhập</span>
        </div>
        <div class="credentials-content">
          <div class="credential-item">
            <span class="credential-label">Tên đăng nhập</span>
            <span class="credential-value" (click)="fillUsername()">admin</span>
          </div>
          <div class="credential-item">
            <span class="credential-label">Mật khẩu</span>
            <span class="credential-value" (click)="fillPassword()">admin123</span>
          </div>
        </div>
      </div>
      
      <div class="security-info">
        <div class="security-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 6v6l4 2"/>
          </svg>
        </div>
        <span>Phiên đăng nhập có hiệu lực trong 8 giờ</span>
      </div>
    </div>
  </div>
</div>
